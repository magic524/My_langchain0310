name: contract-review-ci

on:
  workflow_dispatch:
  pull_request:
    branches:
      - main
      - dev
  push:
    branches:
      - main
      - dev
      - feat/**

jobs:
  test:
    name: ci/test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python syntax (smoke)
        run: |
          python -m py_compile Contract_Review_System/only_prompt_local_llm/local_model_runner.py
          python -m py_compile Contract_Review_System/tests/scripts/evaluate.py
